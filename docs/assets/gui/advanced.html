<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旧工具已降级 · 本地知识整理助手</title>
  <style>
    :root {
      --page: #f5f7fb;
      --paper: #ffffff;
      --ink: #102033;
      --muted: #64748b;
      --line: #dce6f2;
      --blue: #2f72e7;
      --cyan: #22b8cf;
      --shadow: 0 22px 70px rgba(25, 42, 62, .10);
      --font: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font);
      background:
        radial-gradient(circle at 12% 0%, rgba(47, 114, 231, .11), transparent 30rem),
        radial-gradient(circle at 92% 5%, rgba(34, 184, 207, .10), transparent 28rem),
        var(--page);
    }
    a { color: inherit; text-decoration: none; }
    .page {
      width: min(960px, calc(100vw - 36px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }
    .topbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 950;
      letter-spacing: -.02em;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, #dff3ff, #2f72e7 48%, #22b8cf);
      box-shadow: 0 10px 28px rgba(47, 114, 231, .22);
    }
    .home-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: #25364a;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(25, 42, 62, .05);
    }
    .panel {
      margin-top: 24px;
      padding: clamp(26px, 4vw, 42px);
      border-radius: 30px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .kicker {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -.06em;
    }
    .lead {
      max-width: 760px;
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 17px;
    }
    .core-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 26px;
    }
    .core-card {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #f8fafc;
    }
    .core-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: -.03em;
    }
    .core-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }
    .note {
      margin-top: 22px;
      padding: 16px;
      border-radius: 18px;
      background: #eef6ff;
      border: 1px solid #d7e9ff;
      color: #244262;
      line-height: 1.7;
      font-weight: 780;
    }
    @media (max-width: 820px) {
      .topbar { display: grid; }
      .core-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <span>本地知识整理助手</span>
      </a>
      <a class="home-link" href="/">返回首页</a>
    </nav>

    <main class="panel">
      <p class="kicker">Core loop only</p>
      <h1>旧工具已降级</h1>
      <p class="lead">这个页面不再提供低频诊断按钮。产品主线只保留三件事：添加资料必须真实入库，搜索回顾必须能找到已沉淀证据，生成 AI 上下文包必须基于证据输出可复制 prompt。</p>

      <section class="core-grid" aria-label="当前保留的三个入口">
        <article class="core-card">
          <h2>添加资料</h2>
          <p>粘贴资料、AI 对话摘要或本地路径，写入新的 Obsidian 记录和清单。</p>
        </article>
        <article class="core-card">
          <h2>搜索回顾</h2>
          <p>按关键词检索已整理内容，只返回有来源的证据，不编造答案。</p>
        </article>
        <article class="core-card">
          <h2>生成 AI 上下文包</h2>
          <p>先预览候选来源，再基于确认来源生成 Markdown 和可复制 prompt。</p>
        </article>
      </section>

      <div class="note">如果需要恢复某个旧工具，应先证明它服务三主闭环；否则不回到 GUI 首页。</div>
    </main>
  </div>
</body>
</html>
