name: Verify workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -q
      - run: python -X utf8 -m unittest discover -s bridge/tests -q
      - run: npm ci
        working-directory: web
      - run: node --experimental-strip-types --test tests/*.test.mjs
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
