name: Verify workspace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -q
      - run: python -X utf8 -m unittest discover -s bridge/tests -q
      - run: npm run install:ci
        working-directory: web
      - run: node --experimental-strip-types --test tests/*.test.mjs
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -X utf8 scripts/package_release.py --output artifacts/Obsidian-Workspace-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Workspace-Windows-Python-${{ matrix.python }}
          path: artifacts/Obsidian-Workspace-Windows.zip
